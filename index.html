<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>WebRTC чат</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c8dff'/%3E%3Cpath d='M9 11h14v8H9z' fill='%230b0f16'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>WebRTC чат</span>
        </div>
        <div class="status" id="status">Не в кімнаті</div>
      </header>

      <section class="join" id="joinView">
        <form class="join-form" id="joinForm">
          <h1>P2P чат без сервера</h1>
          <p class="lead">
            Повідомлення йдуть напряму між браузерами. Signaling — через мережу Nostr.
          </p>
          <label class="field">
            <span>Ваше ім'я</span>
            <input id="nameInput" name="name" maxlength="32" required autocomplete="name" placeholder="Олег">
          </label>
          <label class="field">
            <span>Кімната</span>
            <input id="roomInput" name="room" maxlength="64" required autocomplete="off" placeholder="demo">
          </label>
          <button class="primary" type="submit">Увійти в кімнату</button>
          <p class="hint">
            Відкрийте це посилання в іншому браузері та введіть ту саму кімнату.
          </p>
        </form>
      </section>

      <section class="chat" id="chatView" hidden>
        <aside class="sidebar">
          <div class="sidebar-head">
            <span class="sidebar-label">Кімната</span>
            <strong id="roomLabel"></strong>
          </div>
          <div class="peers">
            <h2>Онлайн <span class="counter" id="peerCount">0</span></h2>
            <ul class="peer-list" id="peerList"></ul>
          </div>
          <button class="ghost" type="button" id="leaveButton">Вийти</button>
        </aside>

        <div class="conversation">
          <ol class="messages" id="messages" aria-live="polite"></ol>
          <form class="composer" id="composer">
            <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Повідомлення…" aria-label="Повідомлення"></textarea>
            <button class="primary" type="submit">Надіслати</button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
